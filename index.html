<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dahaboly Pay</title>
<meta name="theme-color" content="#4CC2C4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dahaboly Pay">
<meta name="application-name" content="Dahaboly Pay">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: playful game-night banking, confident and quick, like a real wallet app.
IDEA: an InstaPay-style wallet for the Dahaboly board — a bank card in your pocket.
PICTURE: the teal Dahaboly card with your balance, big, then round action buttons.
COLOUR and TYPE: board orange ground, teal card, navy ink, group colours on properties; Tajawal.
LAYOUT: one phone-width column; bottom sheets for every flow; live feed below.
*/
:root{color-scheme:light dark;
--bg:light-dark(#fbf7f1,#0c2230);--ink:light-dark(#133347,#f5eee3);--mute:light-dark(#5d6b73,#9fb0b8);
--card:light-dark(#fff,#15293a);--line:light-dark(#eadfce,#243b4d);--or:#E9A952;--tl:#4CC2C4;--nv:#133347;--rd:#923D2A;--gr:#2E9E5B;--moon:#6BBFC3;--gold:#E9A952;--chest:#923D2A}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Tajawal,system-ui,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--tl);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.brand{font-weight:800;font-size:22px;letter-spacing:.3px}.brand b{color:var(--or)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;min-height:36px}
.ccard{position:relative;direction:ltr;aspect-ratio:1.586/1;border-radius:20px;overflow:hidden;color:#fff;
box-shadow:0 18px 34px -16px #13334799,inset 0 1px 0 #ffffff40;font-family:Montserrat,Tajawal,sans-serif;isolation:isolate}
.ccard.teal{background:linear-gradient(118deg,#0b6f71 0%,#1d8c8d 38%,#5ab7b8 55%,#1f8d8e 72%,#0c6c6e 100%)}
.ccard.gold{background:linear-gradient(118deg,#b9741f 0%,#d99536 38%,#f6c77c 55%,#dc9a3c 72%,#b87220 100%)}
.ccard .pat{position:absolute;right:-12%;bottom:-38%;width:52%;opacity:.16;z-index:-1}
.ccard .pat2{position:absolute;left:-14%;top:-30%;width:30%;opacity:.12;z-index:-1;transform:rotate(180deg)}
.ccard .lg{position:absolute;top:7%;right:6%;width:36%}
.ccard .ard{position:absolute;right:5%;top:31%;width:74%;opacity:.55}
.ccard .chip{position:absolute;left:6%;top:11%;width:13%;aspect-ratio:1.3;border-radius:6px;background:linear-gradient(135deg,#f4f4f4,#bdbdbd 45%,#e9e9e9 60%,#a9a9a9);box-shadow:inset 0 0 0 1px #0002}
.ccard .chip:before{content:"";position:absolute;inset:22% 0;border-top:1px solid #0003;border-bottom:1px solid #0003}
.ccard .chip:after{content:"";position:absolute;inset:0 38%;border-left:1px solid #0003;border-right:1px solid #0003}
.ccard .nfc{position:absolute;left:21%;top:12.5%;width:6%}
.ccard .bal{position:absolute;left:6%;top:56%;display:flex;align-items:center;gap:8px;font-size:clamp(26px,8vw,36px);font-weight:700;letter-spacing:.5px;text-shadow:0 1px 2px #0003}
.ccard .bl{position:absolute;left:6%;top:49%;font-size:11px;letter-spacing:1.5px;opacity:.85;font-weight:600;text-transform:uppercase}
.ccard .eye{width:34px;height:34px;border-radius:50%;background:#ffffff2e;display:grid;place-items:center}
.ccard .nm{position:absolute;left:6%;bottom:8%;font-size:clamp(12px,3.6vw,15px);letter-spacing:1.6px;font-weight:600;text-transform:uppercase;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .cd{position:absolute;right:6%;bottom:8%;text-align:right;font-size:clamp(13px,3.8vw,17px);letter-spacing:2.5px;font-weight:600;color:#fff}
.ccard .cd small{display:block;font-size:8px;letter-spacing:1px;opacity:.8;font-weight:600}
.cardbar{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 0;font-size:14px}
.swatch{display:inline-flex;gap:6px;align-items:center}
.swatch button{width:30px;height:30px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--line)}
.swatch button.on{box-shadow:0 0 0 2px var(--ink)}
/* banknote */
.note100{position:relative;width:min(300px,86%);aspect-ratio:1.9/1;margin:14px auto 8px;border-radius:6px;background:#E9A952;
background-image:repeating-radial-gradient(circle at 50% 50%,#0000 0 9px,#ffffff1c 9px 11px);box-shadow:0 14px 26px -12px #13334799;
animation:fly .6s cubic-bezier(.2,.8,.3,1.2);direction:ltr}
.note100:before{content:"";position:absolute;inset:7px;border:2px solid #923D2A;border-radius:3px}
.note100 .c{position:absolute;top:50%;transform:translateY(-50%);width:23%;aspect-ratio:1;border-radius:50%;background:#fff;border:3px solid #923D2A;display:grid;place-items:center;font:800 clamp(11px,3.4vw,15px) Montserrat,sans-serif;color:#923D2A}
.note100 .l{left:6%}.note100 .r{right:6%}
.note100 .mid{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:34%;aspect-ratio:1;border-radius:50%;background:#e39b3c;border:2px solid #923D2A;display:grid;place-items:center}
.note100 .mid img{width:62%}
.note100 .tag{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);background:#4CC2C4;color:#fff;border:2px solid #fff;outline:2px solid #923D2A;border-radius:6px;padding:0 8px;font:800 clamp(10px,3vw,13px) Montserrat,sans-serif;letter-spacing:.5px}
@keyframes fly{from{transform:translateY(60px) rotate(-14deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.note100{animation:none}}
/* chance / chest cards */
.gcard{border-radius:18px;padding:22px 18px;color:#fff;text-align:center;margin:4px 0 14px;animation:flip .45s ease}
.gcard.ch{background:#923D2A}.gcard.cc{background:#4CC2C4}
.gcard .gi{width:84px;height:84px;margin:0 auto 10px;display:grid;place-items:center;border-radius:20px;background:#ffffff22}
.gcard .gt{font:800 14px Montserrat,Tajawal,sans-serif;letter-spacing:2px;opacity:.9;margin-bottom:8px}
.gcard p{font-size:19px;font-weight:700;margin:0;line-height:1.45}
@keyframes flip{from{transform:rotateY(80deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.gcard{animation:none}}

/* splash */
.splash{position:fixed;inset:0;z-index:60;background:#4CC2C4;display:grid;place-items:center;overflow:hidden;transition:opacity .45s ease,visibility .45s}
.splash.out{opacity:0;visibility:hidden}
.splash .ring{position:absolute;width:140vmax;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ffffff22 0 30%,#0000 31%);animation:ring 2.4s ease-out forwards}
.splash .in{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;direction:ltr}
.splash .mk{width:min(34vw,150px);animation:mk .9s cubic-bezier(.2,.9,.3,1.3) both}
.splash .wd{font:800 clamp(30px,9vw,46px)/1 Montserrat,sans-serif;color:#fff;letter-spacing:2px;display:flex}
.splash .wd span{display:inline-block;animation:up .5s cubic-bezier(.2,.9,.3,1.2) both}
.splash .wd b{color:#133347;margin-left:10px}
.splash .ar{width:min(64vw,300px);clip-path:inset(0 0 0 100%);animation:wipe .8s .95s ease forwards}
.splash .skip{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));color:#fff;opacity:.8;font-size:14px;font-weight:700}
@keyframes mk{from{transform:scale(.2) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes ring{from{transform:scale(.1);opacity:1}to{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.splash *{animation:none!important;clip-path:none!important}}
/* onboarding */
.onb{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.onb .top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0;max-width:480px;width:100%;margin:0 auto}
.onb .vp{flex:1;overflow:hidden;touch-action:pan-y;display:flex}
.onb .track{flex:1;display:flex;transition:transform .35s ease}
@media (prefers-reduced-motion:reduce){.onb .track{transition:none}}
.onb .sl{flex:0 0 100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 24px;text-align:center}
.onb .pic{width:100%;max-width:360px;min-height:250px;display:grid;place-items:center;margin-bottom:22px}
.onb h2{font-size:30px;line-height:1.15;margin:0 0 10px;font-weight:800;max-width:16ch;text-wrap:balance}
.onb p{color:var(--mute);font-size:17px;margin:0;max-width:32ch}
.onb .bot{padding:14px 20px max(22px,env(safe-area-inset-bottom));max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;align-items:center}
.dots{display:flex;gap:8px}.dots i{width:8px;height:8px;border-radius:9px;background:var(--line);transition:width .25s}.dots i.on{width:26px;background:#E9A952}
.onb .acts2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.onb .acts2 span{width:58px;height:58px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.onb .acts2 svg{width:28px;height:28px}
.codechip{font:800 40px Montserrat,sans-serif;letter-spacing:10px;background:var(--card);border:2px dashed #E9A952;border-radius:18px;padding:10px 18px 10px 28px;direction:ltr}
.avs{display:flex;justify-content:center;margin-top:18px;direction:ltr}.avs .av{margin-inline:-6px;border:3px solid var(--bg);width:52px;height:52px;font-size:20px}

/* bank screen */
.bk{max-width:1280px;margin:0 auto;padding:0 0 30px}
.bkh{background:#4CC2C4;color:#fff;border-radius:0 0 26px 26px;padding:14px clamp(14px,3vw,28px) 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:relative;overflow:hidden}
.bkh .pt{position:absolute;right:-40px;top:-30px;width:180px;opacity:.15}
.bkh .l{display:flex;align-items:center;gap:14px;position:relative}
.bkh .l img{height:44px}
.bkh .l b{font:800 clamp(18px,3vw,26px) Montserrat,sans-serif;letter-spacing:2px;border-inline-start:2px solid #fff8;padding-inline-start:14px}
.bkh .c{position:relative;text-align:center;direction:ltr}
.bkh .c small{display:block;font:700 11px Montserrat,sans-serif;letter-spacing:2px;opacity:.85}
.bkh .c span{font:800 clamp(28px,6vw,44px)/1 Montserrat,sans-serif;letter-spacing:8px;color:#133347}
.bkh .r{display:flex;gap:6px;position:relative}
.bkh .r button{background:#ffffff2e;color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;min-height:40px;font-size:14px}
.bkg{display:grid;gap:16px;padding:16px clamp(12px,2.5vw,24px) 0;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.bkg{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.box h3{margin:0 0 10px;font-size:17px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline}
.box h3 small{color:var(--mute);font-weight:600;font-size:13px}
.last{border-radius:20px;padding:16px;color:#fff;background:#133347;display:flex;align-items:center;gap:14px;min-height:110px}
.last.pop{animation:pop2 .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop2{from{transform:scale(.92);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.last.pop{animation:none}}
.last .t{flex:1}.last .t div:first-child{font-size:clamp(17px,2.6vw,22px);font-weight:800}
.last .t div+div{opacity:.8;font-size:14px}
.last .amt{font:800 clamp(28px,5vw,42px) Montserrat,sans-serif;color:#E9A952}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.stats small{display:block;color:var(--mute);font-size:13px;font-weight:600}
.stats b{font:800 clamp(18px,3vw,26px) Montserrat,sans-serif;direction:ltr;display:block}
.lb{display:flex;flex-direction:column;gap:10px}
.lbr{display:flex;align-items:center;gap:12px;border-radius:16px;padding:10px 12px;color:#fff;position:relative;overflow:hidden}
.lbr.teal{background:linear-gradient(118deg,#0b6f71,#1d8c8d 45%,#4fb0b1)}.lbr.gold{background:linear-gradient(118deg,#b9741f,#d99536 45%,#efbd6e)}
.lbr .rk{font:800 22px Montserrat,sans-serif;width:28px;text-align:center;opacity:.9}
.lbr .av{border:2px solid #fff}
.lbr .t{flex:1}.lbr .t div:first-child{font-weight:800;font-size:18px}
.lbr .t div+div{font-size:13px;opacity:.9}
.lbr .m{text-align:end;direction:ltr}.lbr .m b{display:block;font:800 clamp(20px,3.4vw,28px) Montserrat,sans-serif}
.lbr .m small{font-size:12px;opacity:.9}
.own{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ot{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);min-height:72px;display:flex;flex-direction:column}
.ot i{height:9px;display:block}
.ot .n{font-size:12px;font-weight:700;padding:6px 8px 2px;line-height:1.25;flex:1}
.ot .o{display:flex;align-items:center;gap:6px;padding:4px 8px 7px;font-size:12px;color:var(--mute)}
.ot .o .av{width:20px;height:20px;font-size:11px}
.ot.sold{border-color:#E9A952}
.bkfeed .row{padding:9px 4px}
.bkin{margin-top:16px}
.hero .ccard{margin:6px auto 0;max-width:360px;text-align:left}
.acts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 4px;margin:18px 0}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;line-height:1.25;font-weight:700;text-align:center;min-height:44px}
.act i{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-style:normal}
.act svg{width:26px;height:26px}
.banner{background:#E9A952;color:#133347;border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:700}
.banner .b2{display:flex;gap:6px;flex:none}
.btn{background:light-dark(#133347,#f5eee3);color:light-dark(#fff,#133347);border-radius:14px;padding:12px 18px;font-weight:800;min-height:48px}
.btn.or{background:#E9A952;color:#133347}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;min-height:38px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 8px}
.sec h2{font-size:18px;margin:0;font-weight:800}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:14px;margin-top:8px}
.tabs button{flex:1;padding:8px;border-radius:10px;font-weight:700;min-height:40px;font-size:14px}
.tabs .on{background:light-dark(#133347,#f5eee3);color:light-dark(#fff,#133347)}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;font-size:17px}
.row .t{flex:1}.row .t div:first-child{font-weight:700}
.row .s{font-size:13px;color:var(--mute)}
.amt{font-weight:800;direction:ltr;white-space:nowrap}.amt.p{color:var(--gr)}.amt.m{color:var(--rd)}
.undo{font-size:13px;color:var(--tl);font-weight:800;padding:4px 0;min-height:32px}
.empty{padding:22px;text-align:center;color:var(--mute)}
.sw{width:10px;align-self:stretch;border-radius:4px;flex:none}
/* sheet */
.scrim{position:fixed;inset:0;background:#0009;display:none;z-index:20}
.scrim.on{display:block}
.sheet{position:fixed;inset-inline:0;bottom:0;margin:0 auto;max-width:480px;background:var(--bg);border-radius:24px 24px 0 0;z-index:21;
max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding:10px 18px 24px}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 12px;font-size:20px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.x{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:20px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.pick button{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px;min-height:44px}
.pick button.on{border-color:var(--tl);background:light-dark(#e8f6f5,#173a44)}
.big{font-size:44px;font-weight:800;text-align:center;direction:ltr;margin:6px 0;min-height:60px}
.big small{font-size:22px;color:var(--mute)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr;margin:8px 0 12px}
.pad button{background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:24px;font-weight:700;min-height:56px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.presets button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;min-height:40px;font-size:14px}
.presets button.on{background:light-dark(#133347,#f5eee3);color:light-dark(#fff,#133347);border-color:transparent}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.field input{width:100%;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);min-height:48px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 16px;margin:10px 0 14px}
.sum div{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);gap:10px}
.sum div:first-child{border-top:0}.sum span{color:var(--mute)}
.ok{text-align:center;padding:10px 0}
.ok .ck{width:92px;height:92px;border-radius:50%;background:var(--gr);display:grid;place-items:center;margin:10px auto 12px;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ok .ck{animation:none}}
.err{color:var(--rd);font-weight:700;min-height:24px;margin:4px 0}
.plist{display:flex;flex-direction:column;gap:8px}
.prop{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:start;min-height:52px;width:100%}
.prop.on{border-color:var(--tl)}
.prop .n{flex:1;font-weight:700}.prop .p{font-weight:800;direction:ltr}
.hero{text-align:center;padding:28px 0 8px}
.hero h1{font-size:40px;line-height:1.05;margin:10px 0 6px;font-weight:800}
.hero p{color:var(--mute);margin:0 auto;max-width:34ch}
.logo{width:120px;height:120px;margin:0 auto;position:relative}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:16px}
.or-row{display:flex;align-items:center;gap:10px;color:var(--mute);margin:14px 0;font-size:14px}.or-row:before,.or-row:after{content:"";flex:1;height:1px;background:var(--line)}

// ---------- derived ----------
function undoneSet(){return new Set(S.tx.filter(x=>x.kind==='undo').map(x=>x.ref))}
function balances(){const b={};const st=S.game?.start||1500;for(const id in S.players)b[id]=st;
  for(const x of S.tx){if(x.from!=='bank'&&x.from in b)b[x.from]-=x.amount;if(x.to!=='bank'&&x.to in b)b[x.to]+=x.amount}return b}
function owners(){const o={};const u=undoneSet();for(const x of [...S.tx].sort((a,b)=>a.ts-b.ts)){if(x.kind==='buy'&&x.prop&&!u.has(x.id))o[x.prop]=x.from}return o}
function pname(id){if(id==='bank')return t('bank');const p=S.players[id];return p?esc(p.name):'?'}
function pcol(id){return id==='bank'?'#E9A952':(S.players[id]?.color||'#5d6b73')}
function av(id,sz=40){const n=id==='bank'?'$':(S.players[id]?.name||'?').trim().charAt(0).toUpperCase();return `<span class="av" style="background:${pcol(id)};width:${sz}px;height:${sz}px">${esc(n)}</span>`}

let fbResolve;const fbP=new Promise(r=>fbResolve=r);window.__fbReady=api=>fbResolve(api);
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
async function boot(){
  setLang();render();showSplash();
  const timer=setTimeout(()=>{if(!S.db){S.err=t('noDb');S.ready=true;render()}},10000);
  const db=await fbP;clearTimeout(timer);
  S.db=db;
  if(!db){S.err=t('noDb');S.ready=true;render();return}
  let id=lsGet('dp_id');if(!id){id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);lsSet('dp_id',id)}
  S.uid=id;
  const code=lsGet('dp_code');
  if(code){try{const g=await db.doc(`games/${code.toUpperCase()}`).get();if(g.exists){S.lastCode=code.toUpperCase();const me=await db.doc(`games/${S.lastCode}/players/${S.uid}`).get();S.lastName=me.exists?me.data().name:''}else saveProfile('')}catch(e){}}
  S.ready=true;render();
  if(location.hash==='#bank'&&lsGet('dp_bank')){try{await openBank(lsGet('dp_bank'))}catch(e){}}
}
function saveProfile(code){lsSet('dp_code',code||'')}

async function enter(code,silent){
  code=code.toUpperCase().trim();
  const g=await S.db.doc(`games/${code}`).get();
  if(!g.exists){if(!silent){S.err=t('notFound');render()}else saveProfile('');return false}
  S.code=code;S.game=g.data();subscribe();if(!S.bankOpening)saveProfile(code);return true;
}
function subscribe(){
  unsub.forEach(u=>u());unsub=[];S.slow=false;clearTimeout(slowTimer);
  slowTimer=setTimeout(()=>{S.slow=true;render()},10000);
  const g=`games/${S.code}`,fail=e=>{clearTimeout(slowTimer);if(e?.code==='revoked'){S.err=t('noDb')}render()};
  unsub.push(S.db.doc(g).onSnapshot(s=>{if(s.exists)S.game=s.data();render()},fail));
  unsub.push(S.db.collection(g+'/players').onSnapshot(s=>{S.players={};s.docs.forEach(d=>S.players[d.id]=d.data());clearTimeout(slowTimer);S.slow=false;render()},fail));
  unsub.push(S.db.collection(g+'/tx').onSnapshot(s=>{S.tx=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);render()},fail));
  unsub.push(S.db.collection(g+'/req').onSnapshot(s=>{S.reqs=s.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.status==='open');render()},fail));
}

async function writeErr(e){if(e?.code==='permission-denied'||e?.code==='invalid_argument'){toast(t('noWrite'))}else if(e?.code==='quota_exceeded')toast(e.message);else toast('⚠ '+(e?.message||'error'));render()}

async function createGame(name,start){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code;
  for(let i=0;i<6;i++){code=Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join('');const g=await S.db.doc(`games/${code}`).get();if(!g.exists)break}
  await S.db.doc(`games/${code}`).set({code,start,host:S.uid,createdAt:Date.now()});
  await S.db.doc(`games/${code}/players/${S.uid}`).set({name,color:PCOL[0],joinedAt:Date.now()});
  await enter(code);
}
async function joinGame(name,code){
  code=code.toUpperCase().trim();
  const g=await S.db.doc(`games/${code}`).get();if(!g.exists){S.err=t('notFound');render();return}
  const ps=await S.db.collection(`games/${code}/players`).get();
  let me=ps.docs.find(d=>d.id===S.uid);
  if(!me){const same=ps.docs.find(d=>(d.data().name||'').trim().toLowerCase()===name.trim().toLowerCase());if(same){S.uid=same.id;lsSet('dp_id',same.id);me=same}}
  if(!me){if(ps.size>=8){S.err=t('full');render();return}
    const used=new Set(ps.docs.map(d=>d.data().color));const color=PCOL.find(c=>!used.has(c))||PCOL[ps.size%8];
    await S.db.doc(`games/${code}/players/${S.uid}`).set({name,color,joinedAt:Date.now()})}
  await enter(code);
}

function render(){
  const app=$('#app');
  const top=`<div class="top"><div class="brand">${t('brand')}</div><button class="chip" data-a="lang">${t('lang')}</button></div>`;
  if(!S.ready){app.innerHTML=top+`<div class="empty">${S.err?esc(S.err):t('loading')}</div>`;return}
  if(!S.db||!S.uid){app.innerHTML=top+hero()+`<div class="panel">${esc(S.err||t('noDb'))}</div>`;return}
  if(!S.code){app.innerHTML=top+hero()+joinForm();return}
  if(S.bank){app.innerHTML=bankView();return}
  app.innerHTML=top+home();
}

  el.innerHTML=`<span class="ring"></span><div class="in"><img class="mk" src="${IMG.MARKC}" alt="Dahaboly"><div class="wd">${'DAHABOLY'.split('').map((c,i)=>`<span style="animation-delay:${.35+i*.05}s">${c}</span>`).join('')}<b><span style="animation-delay:.85s">PAY</span></b></div><img class="ar" src="${IMG.ARD}" alt=""></div><button class="skip">${t('tapSkip')}</button>`;

}

function readNote(){const n=$('#nt');if(n)F.note=n.value.trim()}
function startFlow(k){F={k,amt:0,note:'',err:''};sheetFor()}

function validate(){
  const bal=balances();
  if(F.k==='send'||F.k==='req'){if(!F.to)return t('chooseP')}
  if(!F.amt||F.amt<=0)return t('enterA');
  if(F.from&&F.from!=='bank'&&F.k!=='req'&&bal[F.from]<F.amt)return t('low');
  return '';
}
function toConfirm(){
  readNote();
  if(F.k==='send'){F.from=S.uid}
  if(F.k==='req'){F.from=S.uid}
  if(F.k==='collect'){F.from='bank';F.to=S.uid}
  if(F.k==='paybank'){F.from=S.uid;F.to='bank'}
  F.err=validate();if(F.err)return sheetFor();
  if(F.k==='req'){F.reqTo=F.to;F.to=S.uid;F.from=F.reqTo}
  F.step='confirm';sheetFor();
}
async function doit(){
  if(F.busy)return;F.busy=true;
  try{
    if(F.k==='req'){await S.db.collection(`games/${S.code}/req`).add({from:S.uid,to:F.reqTo,amount:F.amt,note:F.note||'',status:'open',ts:Date.now()});F.okMsg=t('sentReq')}
    else if(F.k==='payreq'){const bal=balances();if(bal[S.uid]<F.amt){F.err=t('low');F.busy=false;return sheetFor()}
      await addTx({from:S.uid,to:F.to,amount:F.amt,note:F.note||'',kind:'reqpay'});await S.db.doc(`games/${S.code}/req/${F.rid}`).update({status:'paid'})}
    else{const bal=balances();if(F.from!=='bank'&&bal[F.from]<F.amt){F.err=t('low');F.busy=false;return sheetFor()}
      await addTx({from:F.from,to:F.to,amount:F.amt,note:F.note||'',kind:F.k==='paybank'?'pay':F.k,prop:F.prop||null})}
    F.step='ok';F.busy=false;sheetFor();
  }catch(e){F.busy=false;closeSheet();writeErr(e)}
}

  if(a==='close'){closeSheet();return}
  if(a==='howto'){showOnb();return}
  if(a==='bankmode'){b.disabled=true;S.err='';try{await openBank($('#bc').value)}catch(e){writeErr(e)}b.disabled=false;return}
  if(a==='bankexit'){S.bank=false;unsub.forEach(u=>u());unsub=[];S.code=null;S.game=null;S.players={};S.tx=[];S.reqs=[];try{wakeLock&&wakeLock.release()}catch(e){};const w=document.querySelector('.wrap');w.style.maxWidth='';w.style.padding='';try{document.fullscreenElement&&document.exitFullscreen()}catch(e){};render();return}
  if(a==='fs'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}return}
  if(a==='resume'){b.disabled=true;try{await enter(S.lastCode)}catch(e){writeErr(e)}render();return}
  if(a==='hide'){S.hide=!S.hide;try{localStorage.setItem('dp_hide',S.hide?'1':'0')}catch(e){}render();return}
  if(a==='tab'){S.tab=b.dataset.v;render();return}
  if(a==='copy'){try{await navigator.clipboard.writeText(S.code);toast(t('copied'))}catch(e){toast(S.code)}return}
  if(a==='create'||a==='join'){
    const name=$('#nm').value.trim();if(!name){S.err=t('needName');render();return}
    S.err='';b.disabled=true;
    try{if(a==='create'){const st=Math.max(100,parseInt($('#st').value,10)||1500);await createGame(name,st)}else{const c=$('#cd').value;if(c.trim().length<4){S.err=t('notFound');render();return}await joinGame(name,c)}}
    catch(e){writeErr(e)}render();return}
  if(a==='leave'){unsub.forEach(u=>u());unsub=[];S.code=null;S.game=null;S.players={};S.tx=[];S.reqs=[];saveProfile('');S.lastCode=null;render();return}
  if(a.startsWith('f_')){if(!S.canWrite&&!['f_players','f_props'].includes(a)){toast(t('noWrite'));return}startFlow(a.slice(2));return}
  if(a==='pickp'){readNote();F.to=b.dataset.id;F.err='';sheetFor();return}
  if(a==='key'){readNote();const v=b.dataset.v;let s=String(F.amt||'');s=v==='⌫'?s.slice(0,-1):(s+v).slice(0,6);F.amt=parseInt(s,10)||0;F.err='';sheetFor();return}
  if(a==='pre'){F.amt=+b.dataset.v;F.note=b.dataset.n;F.err='';sheetFor();return}
  if(a==='next'){toConfirm();return}
  if(a==='pickprop'){const p=PK[b.dataset.id];F.prop=p.k;F.amt=p.p;F.from=S.uid;F.to='bank';F.note='';F.err=validate();if(F.err)return sheetFor();F.step='confirm';sheetFor();return}
  if(a==='pickrent'){F.prop=b.dataset.id;F.lv=0;sheetFor();return}
  if(a==='lv'){F.lv=+b.dataset.v;sheetFor();return}
  if(a==='rentnext'){const dc=$('#dc');if(dc){F.dice=parseInt(dc.value,10)||0;sheetFor()}
    const o=owners();F.from=S.uid;F.to=o[F.prop];F.err=validate();if(F.err)return sheetFor();F.step='confirm';sheetFor();return}
  if(a==='doit'){doit();return}
  if(a==='card'){try{await S.db.doc(`games/${S.code}/players/${S.uid}`).update({card:b.dataset.v})}catch(e){writeErr(e)}return}
  if(a==='draw'){F.ci=Math.floor(Math.random()*DECK[F.k].length);F.err='';sheetFor();return}
  if(a==='applycard'){if(F.busy)return;const c=DECK[F.k][F.ci],note=(F.k==='chance'?'¿ ':'▣ ')+(S.lang==='ar'?c[0]:c[1]);const bal=balances(),o=others();
    if((c[2]==='p'&&bal[S.uid]<c[3])||(c[2]==='pe'&&bal[S.uid]<c[3]*o.length)){F.err=t('low');return sheetFor()}
    F.busy=true;
    try{if(c[2]==='c')await addTx({from:'bank',to:S.uid,amount:c[3],note,kind:'collect'});
      else if(c[2]==='p')await addTx({from:S.uid,to:'bank',amount:c[3],note,kind:'pay'});
      else if(c[2]==='pe'){for(const id of o)await addTx({from:S.uid,to:id,amount:c[3],note,kind:'send'})}
      else if(c[2]==='ce'){for(const id of o)await addTx({from:id,to:S.uid,amount:c[3],note,kind:'send'})}
      const total=(c[2]==='pe'||c[2]==='ce')?c[3]*o.length:c[3];
      F={k:F.k,step:'ok',amt:total,okMsg:t('cardDone')};sheetFor();
    }catch(e){F.busy=false;closeSheet();writeErr(e)}return}
  if(a==='payreq'){const r=S.reqs.find(x=>x.id===b.dataset.id);if(!r)return;F={k:'payreq',rid:r.id,from:S.uid,to:r.from,amt:r.amount,note:r.note||t('reqSent'),step:'confirm'};sheetFor();return}
  if(a==='decl'){try{await S.db.doc(`games/${S.code}/req/${b.dataset.id}`).update({status:'closed'})}catch(e){writeErr(e)}return}
  if(a==='undo'){const x=S.tx.find(y=>y.id===b.dataset.id);if(!x)return;try{await addTx({from:x.to,to:x.from,amount:x.amount,note:'',kind:'undo',ref:x.id})}catch(e){writeErr(e)}return}
});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('input',e=>{if(e.target.id==='dc'){F.dice=parseInt(e.target.value,10)||0;const o=owners();const own=o[F.prop];const n=P.filter(q=>q.g==='ut'&&o[q.k]===own).length;F.amt=F.dice*(n>1?10:4);const big=$('#sheet .big');if(big)big.innerHTML=money(F.amt)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
setInterval(()=>{if(S.code&&!$('#sheet').classList.contains('on'))render()},30000);
boot();
}
</script>
</body>
</html>
